<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>공개 채팅 실습</title><link rel="stylesheet" href="/static/style.css"><script defer src="/static/chat.js"></script></head>
<body><main><h1>공개 채팅 실습</h1><p>대화명은 본인 인증이 아닙니다. 모든 방은 누구나 참여할 수 있습니다.</p><p><a href="/">방명록·대화명 선택</a></p>
<form id="create-room"><label>방 제목 <input name="title" maxlength="40" required></label><button>방 만들기</button></form>
<button id="refresh">방 목록 새로고침</button><ul id="rooms"></ul>
<h2 id="room-title">참여할 방을 선택하세요</h2><button id="leave" disabled>방 나가기</button><p id="status" role="status"></p><ol id="messages" aria-live="polite"></ol>
<form id="send-message"><label>메시지 <textarea name="message" maxlength="1000" required></textarea></label><button id="send" disabled>보내기</button></form>
<form method="post" action="/session/clear"><button>익명 세션 지우기</button></form></main></body></html>
