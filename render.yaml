# Blueprint Path: Day1-Day8/render.yaml (기존 저장소 전체를 업로드할 때)
# 무료 체험용: SQLite 데이터는 재시작/절전/재배포 시 사라질 수 있습니다.
services:
  - type: web
    name: little-guestbook
    runtime: python
    plan: free
    rootDir: Day1-Day8
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
